
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPStrainer | Gaming Studio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #101a2d;
}
.logo { font-size: 25px; font-weight: 900; }
.logo span { color: #28aaff; }
nav a {
  color: white;
  text-decoration: none;
  margin-left: 15px;
  font-size: 13px;
}
.hero {
  text-align: center;
  padding: 110px 20px;
  background: radial-gradient(circle, #123e70, #080d18 70%);
}
.hero h1 { font-size: 48px; margin: 0; }
.hero h1 span { color: #28aaff; }
.hero p { color: #b6c7df; }
.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 28px;
  background: #168cff;
  color: white;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
section { padding: 55px 20px; text-align: center; }
section h2 { color: #28aaff; }
.card {
  background: #111e33;
  border: 1px solid #203a5c;
  padding: 25px;
  border-radius: 14px;
  max-width: 500px;
  margin: 20px auto;
}
footer {
  text-align: center;
  padding: 25px;
  color: #8296b4;
  background: #101a2d;
}
</style>
</head>
<body>

<header>
  <div class="logo">FPS<span>trainer</span></div>
  <nav>
    <a href="#about">About</a>
    <a href="#games">Games</a>
  </nav>
</header>

<div class="hero">
  <h1>WELCOME TO <span>FPSTRAINER</span></h1>
  <p>Independent Game Development Studio</p>
  <a href="#games" class="btn">Explore Games</a>
</div>

<section id="about">
  <h2>ABOUT US</h2>
  <p>We are FPStrainer, an independent gaming studio<br>
  building creative gaming experiences.</p>
</section>

<section id="games">
  <h2>OUR GAMES</h2>
  <div class="card">
    <h3>Coming Soon</h3>
    <p>Our first game is in development.</p>
  </div>
</section>

<footer>
  © 2026 FPStrainer Studio
</footer>

</body>
</html>
